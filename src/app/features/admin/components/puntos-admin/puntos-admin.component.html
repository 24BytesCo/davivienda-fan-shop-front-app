<div class="card">
  <div class="card-body">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <h2 class="h6 mb-0">Gestión de puntos (usuarios)</h2>
      <button class="btn btn-sm btn-outline-secondary" (click)="load()" [disabled]="loading">Recargar</button>
    </div>

    <div *ngIf="loading" class="text-muted">Cargando usuarios…</div>

    <ng-container *ngIf="!loading && !loadError">
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Rol</th>
              <th>Saldo</th>
              <th class="text-right">Ajuste</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let u of users">
              <td>{{ u.fullName }}</td>
              <td>{{ u.email }}</td>
              <td><span class="badge badge-light">{{ u.role }}</span></td>
              <td>
                <ng-container *ngIf="!stateOf(u.id).loadingSaldo; else loadingSaldoTpl">
                  <span *ngIf="stateOf(u.id).saldo !== undefined; else noSaldoTpl">{{ stateOf(u.id).saldo }}</span>
                </ng-container>
                <ng-template #loadingSaldoTpl><span class="text-muted">Cargando…</span></ng-template>
                <ng-template #noSaldoTpl>
                  <button class="btn btn-link btn-sm p-0" (click)="cargarSaldo(u)">Ver saldo</button>
                </ng-template>
              </td>
              <td class="text-right">
                <div class="d-flex justify-content-end align-items-center">
                  <input type="number" class="form-control form-control-sm w-auto mr-2" min="1" step="1" placeholder="Cant."
                         [(ngModel)]="stateOf(u.id).cantidad">
                  <input type="text" class="form-control form-control-sm w-50 mr-2" placeholder="Concepto opcional"
                         [(ngModel)]="stateOf(u.id).concepto">
                  <button class="btn btn-outline-success btn-sm mr-1" (click)="acreditar(u)" [disabled]="stateOf(u.id).working">+ Puntos</button>
                  <button class="btn btn-outline-danger btn-sm" (click)="debitar(u)" [disabled]="stateOf(u.id).working">- Puntos</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </ng-container>

    <div *ngIf="!loading && loadError" class="alert alert-warning">
      No fue posible listar usuarios desde la API.
      Puedes realizar un ajuste manual por ID de usuario.
    </div>

    <div *ngIf="!loading && loadError" class="mt-3">
      <div class="form-row align-items-end">
        <div class="form-group col-12 col-md-4">
          <label>ID de usuario (UUID)</label>
          <input class="form-control" [(ngModel)]="manual.userId" placeholder="a0eebc99-..." />
        </div>
        <div class="form-group col-6 col-md-3">
          <label>Cantidad</label>
          <input type="number" class="form-control" min="1" step="1" [(ngModel)]="manual.cantidad" />
        </div>
        <div class="form-group col-12 col-md-5">
          <label>Concepto (opcional)</label>
          <input class="form-control" [(ngModel)]="manual.concepto" />
        </div>
      </div>
      <div class="text-right">
        <button class="btn btn-outline-success mr-2" (click)="acreditarManual()" [disabled]="workingManual">Acreditar</button>
        <button class="btn btn-outline-danger" (click)="debitarManual()" [disabled]="workingManual">Debitar</button>
      </div>
    </div>
  </div>
</div>
